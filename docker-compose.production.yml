services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-real_estate}
      MYSQL_APP_USER: ${MYSQL_APP_USER}
      MYSQL_APP_PASSWORD: ${MYSQL_APP_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ${MYSQL_SOURCE_SQL_PATH}:/docker-entrypoint-initdb.d/10-rets_property.sql:ro
      - ./deployment/mysql-init/90-create-search-app.sh:/docker-entrypoint-initdb.d/90-create-search-app.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    logging: &service_logging
      driver: local
      options:
        max-size: 10m
        max-file: "3"

  redis:
    image: redis:7-alpine
    command: redis-server --save "" --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    logging: *service_logging

  api:
    build: .
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: ${MYSQL_APP_USER}
      MYSQL_PASSWORD: ${MYSQL_APP_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-real_estate}
      REDIS_URL: redis://redis:6379/0
      SEARCH_ROOT: data/models/search
      INTENT_MODEL_DIR: data/models/query_intent
      API_DEMO_METRICS_TOKEN: ${API_DEMO_METRICS_TOKEN}
      API_RATE_LIMIT_REQUESTS: ${API_RATE_LIMIT_REQUESTS:-12}
      API_RATE_LIMIT_WINDOW_SECONDS: ${API_RATE_LIMIT_WINDOW_SECONDS:-10}
      API_RERANK_QUEUE_TIMEOUT_SECONDS: ${API_RERANK_QUEUE_TIMEOUT_SECONDS:-20}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ${MODEL_DATA_DIR}:/app/data/models:ro
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://localhost:8000/ready')"]
      interval: 15s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    logging: *service_logging

  demo:
    build:
      context: .
      dockerfile: Dockerfile.demo
    environment:
      API_BASE_URL: http://api:8000
      DEMO_ADMIN_MODE: "false"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    logging: *service_logging

  demo_admin:
    build:
      context: .
      dockerfile: Dockerfile.demo
    environment:
      API_BASE_URL: http://api:8000
      DEMO_ADMIN_MODE: "true"
      DEMO_METRICS_TOKEN: ${API_DEMO_METRICS_TOKEN}
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    logging: *service_logging

  caddy:
    image: caddy:2-alpine
    environment:
      CADDY_EMAIL: ${CADDY_EMAIL}
      PUBLIC_APP_DOMAIN: ${PUBLIC_APP_DOMAIN}
      ADMIN_APP_DOMAIN: ${ADMIN_APP_DOMAIN}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      demo:
        condition: service_started
      demo_admin:
        condition: service_started
    restart: unless-stopped
    logging: *service_logging

volumes:
  mysql_data:
  caddy_data:
  caddy_config:
